name: CI

on:
  push:
    branches: [ "main", "master", "rel-v1.0.0" ]
  pull_request:
    branches: [ "main", "master", "rel-v1.0.0" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Lint
      run: npm run format
      
    - name: Build
      run: npm run build

    # Uncomment if you have tests
    # - name: Test
    #   run: npm run test
